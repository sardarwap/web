<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Eduodia | Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-4 md:p-8">

<div class="max-w-7xl mx-auto bg-white rounded-2xl shadow-xl p-6">
    <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
        <div>
            <h2 class="text-3xl font-extrabold text-slate-800">Admin Dashboard</h2>
            <p class="text-slate-500 mt-1 font-medium">Total Contacts: <span id="contactCount" class="font-bold text-indigo-600 text-lg">0</span></p>
        </div>
        <button onclick="exportVCF()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-lg font-bold shadow-lg transition">Export .vcf</button>
    </div>

    <div class="flex flex-wrap gap-4 mb-6 bg-slate-100 p-4 rounded-xl">
        <input type="number" id="filterAge" placeholder="Filter by Age" class="border px-4 py-2 rounded-lg w-full md:w-32">
        <select id="filterGender" class="border px-4 py-2 rounded-lg w-full md:w-40">
            <option value="">All Genders</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
        </select>
        <button onclick="renderTable()" class="bg-slate-800 text-white px-6 py-2 rounded-lg font-bold hover:bg-slate-700 transition">Apply Filter</button>
    </div>

    <div class="overflow-x-auto border border-slate-200 rounded-lg">
        <table class="w-full text-left border-collapse">
            <thead class="bg-slate-200">
                <tr>
                    <th class="p-4 border-b">Name</th>
                    <th class="p-4 border-b">Mobile</th>
                    <th class="p-4 border-b">Age</th>
                    <th class="p-4 border-b">Gender</th>
                    <th class="p-4 border-b">Exam</th>
                    <th class="p-4 border-b">Actions</th>
                </tr>
            </thead>
            <tbody id="memberTable" class="divide-y divide-slate-200"></tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, deleteDoc, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDGr1EE59FUw9BP1LMMxqnPp7c0thbGxn0",
        authDomain: "contacts-ba8c2.firebaseapp.com",
        projectId: "contacts-ba8c2",
        storageBucket: "contacts-ba8c2.firebasestorage.app",
        messagingSenderId: "850830401947",
        appId: "1:850830401947:web:94bcbeeedf6a7536bf813e",
        measurementId: "G-FX6ZW2L2Q0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let allMembers = [];

    async function loadMembers() {
        try {
            const querySnapshot = await getDocs(collection(db, "members"));
            allMembers = querySnapshot.docs.map(d => ({ id: d.id, ...d.data() }));
            renderTable();
        } catch (error) {
            console.error("Error loading members:", error);
            alert("Failed to load contacts. Please check your database connection.");
        }
    }

    window.renderTable = () => {
        const age = document.getElementById('filterAge').value;
        const gender = document.getElementById('filterGender').value;
        
        const filtered = allMembers.filter(m => (!age || m.age == age) && (!gender || m.gender === gender));

        // Update the live counter based on filtered results
        document.getElementById('contactCount').innerText = filtered.length;

        document.getElementById('memberTable').innerHTML = filtered.map(m => `
            <tr class="hover:bg-slate-50 transition">
                <td class="p-4">${m.name || 'N/A'}</td>
                <td class="p-4">${m.mobile || 'N/A'}</td>
                <td class="p-4">${m.age || 'N/A'}</td>
                <td class="p-4 capitalize">${m.gender || 'N/A'}</td>
                <td class="p-4 font-semibold text-indigo-600">${m.exam || 'N/A'}</td>
                <td class="p-4 flex gap-3">
                    <button data-id="${m.id}" data-action="edit" class="text-blue-600 font-bold hover:text-blue-800 transition">Edit</button>
                    <button data-id="${m.id}" data-action="delete" class="text-red-600 font-bold hover:text-red-800 transition">Delete</button>
                </td>
            </tr>
        `).join('');
        
        // Show empty state message if no results match the filter
        if (filtered.length === 0) {
            document.getElementById('memberTable').innerHTML = `
                <tr><td colspan="6" class="p-8 text-center text-slate-500">No contacts found matching your criteria.</td></tr>
            `;
        }
    };

    document.getElementById('memberTable').addEventListener('click', async (e) => {
        const action = e.target.dataset.action;
        const id = e.target.dataset.id;
        if (!action || !id) return;

        if (action === 'delete') {
            if(confirm("Are you sure you want to delete this member?")) {
                await deleteDoc(doc(db, "members", id));
                location.reload();
            }
        } else if (action === 'edit') {
            const field = prompt("Which field to edit? (Enter: name, age, exam, or gender)");
            
            if (field && ['name', 'age', 'exam', 'gender'].includes(field.toLowerCase().trim())) {
                const lowerField = field.toLowerCase().trim();
                const promptMsg = lowerField === 'gender' ? "Enter new gender (male, female, or other):" : `Enter new value for ${lowerField}:`;
                const newValue = prompt(promptMsg);
                
                if (newValue !== null) {
                    const updateData = {};
                    updateData[lowerField] = newValue.toLowerCase();
                    await updateDoc(doc(db, "members", id), updateData);
                    location.reload();
                }
            } else if (field) {
                alert("Invalid field. Use: name, age, exam, or gender.");
            }
        }
    });

    window.exportVCF = () => {
        if (allMembers.length === 0) {
            alert("No contacts to export.");
            return;
        }
        let vcf = allMembers.map(m => `BEGIN:VCARD\nVERSION:3.0\nFN:${m.name}\nTEL:${m.mobile}\nEND:VCARD`).join('\n');
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([vcf], { type: 'text/vcard' }));
        a.download = "eduodia_contacts.vcf";
        a.click();
    };

    loadMembers();
</script>
</body>
</html>
