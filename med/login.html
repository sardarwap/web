<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - MediQuick</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background: var(--bg-color);">

    <div class="form-card" style="width: 100%; max-width: 400px; padding: 40px 30px;">
        <div style="text-align: center; margin-bottom: 30px;">
            <h2 style="color: var(--primary); font-size: 2rem; margin-bottom: 5px;">💊 MediQuick</h2>
            <p style="color: var(--text-light);">Secure Admin Access</p>
        </div>
        
        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required placeholder="admin@mediquick.com">
            </div>
            <div class="form-group" style="margin-bottom: 25px;">
                <label>Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn" id="loginBtn" style="padding: 15px; font-size: 1.1rem;">Secure Login</button>
        </form>
        
        <p id="errorMsg" style="color: var(--danger); text-align: center; margin-top: 15px; display: none; font-weight: 500;"></p>
        
        <div style="text-align: center; margin-top: 30px;">
            <a href="index.html" style="color: var(--text-light); text-decoration: none; font-size: 0.9rem;">← Return to Shop</a>
        </div>
    </div>

    <script type="module" src="js/login.js"></script>
</body>
</html>
