<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eduodia - Global Leaderboard</title>
    <style>
        :root {
            --primary-color: #4A90E2;
            --bg-color: #f4f7f6;
            --card-bg: #fff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); padding: 30px 15px; display: flex; justify-content: center; }
        
        .leaderboard-container { background: var(--card-bg); max-width: 700px; width: 100%; padding: 30px 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: var(--primary-color); margin-bottom: 5px; font-size: 2em; }
        p.subtitle { text-align: center; color: #666; margin-top: 0; margin-bottom: 25px; font-size: 0.95em; }
        
        .quiz-select-container { text-align: center; margin-bottom: 15px; }
        .quiz-select { padding: 12px 16px; font-size: 1.05em; font-weight: bold; color: #333; border: 2px solid var(--primary-color); border-radius: 8px; width: 100%; max-width: 420px; background-color: #fff; cursor: pointer; outline: none; }
        
        .active-exam-display { text-align: center; margin-bottom: 20px; font-size: 1.3em; color: #2c3e50; display: none; }
        .active-exam-display strong { color: var(--primary-color); font-weight: 900; letter-spacing: 0.5px; text-transform: capitalize; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 14px; text-align: left; border-bottom: 1px solid #eee; }
        th { background-color: var(--primary-color); color: white; font-weight: 600; text-transform: uppercase; font-size: 0.85em; letter-spacing: 0.5px; }
        tr:hover { background-color: #fcfcfc; }
        
        /* --- Medal Styles (Icons only) --- */
        .medal-badge { font-size: 1.8em; }

        /* --- Circular Colorful Badges for Rank 4+ --- */
        .rank-circle { 
            display: inline-flex; align-items: center; justify-content: center;
            width: 35px; height: 35px; border-radius: 50%; 
            font-weight: 800; font-size: 0.95em;
            background-color: var(--primary-color); color: white;
        }
        
        .student-name { font-size: 1.05em; font-weight: 600; color: #2c3e50; text-transform: capitalize; }
        .score-value { font-weight: bold; font-size: 1.1em; color: #27ae60; }

        @media (max-width: 500px) {
            th, td { padding: 12px 8px; font-size: 0.95em; }
            .leaderboard-container { padding: 20px 12px; }
            h1 { font-size: 1.7em; }
        }
    </style>
</head>
<body>

    <div class="leaderboard-container">
        <button onclick="window.location.href='profile.html'" style="padding: 10px 16px; background: #333; color: white; border: none; border-radius: 6px; cursor: pointer; margin-bottom: 20px; font-weight: bold; font-size: 0.9em;">← Back to Profile</button>
        
        <h1>🏆 Exam Leaderboard</h1>
        <p class="subtitle">Real-time global rankings sorted by highest scores</p>
        
        <div class="quiz-select-container">
            <select id="quiz-dropdown" class="quiz-select" onchange="renderLeaderboard()">
                <option value="">Loading exams...</option>
            </select>
        </div>

        <div id="active-exam-title" class="active-exam-display">
            Showing Ranks for: <strong id="exam-name-highlight">...</strong>
        </div>
        
        <table>
            <thead>
                <tr>
                    <th style="width: 20%;">Rank</th>
                    <th style="width: 50%;">Student Name</th>
                    <th style="width: 30%;">Score</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body">
                <tr><td colspan="3" style="text-align:center; padding: 30px; color:#777;">Accessing database entries...</td></tr>
            </tbody>
        </table>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBKUwaFzBIIHr0q_qGE2GT7t5ulxnZRJYY",
            authDomain: "quiz-web-f4cb8.firebaseapp.com",
            projectId: "quiz-web-f4cb8",
            storageBucket: "quiz-web-f4cb8.firebasestorage.app",
            messagingSenderId: "724284966944",
            appId: "1:724284966944:web:319a680630af1703a39445",
            measurementId: "G-VSCB35YM1J"
        };
        firebase.initializeApp(firebaseConfig); const db = firebase.firestore();

        const tableBody = document.getElementById('leaderboard-body');
        const quizDropdown = document.getElementById('quiz-dropdown');
        
        let allRecords = []; 
        let quizTitleDictionary = {}; 

        document.addEventListener("DOMContentLoaded", async () => {
            await fetchQuizDictionary();
            loadLeaderboardData();
        });

        async function fetchQuizDictionary() {
            try {
                const response = await fetch('app_quiz.json');
                if (!response.ok) return;
                const data = await response.json();
                
                function extractTitles(items) {
                    items.forEach(item => {
                        if (item.title) {
                            if (item.id) quizTitleDictionary[item.id.toUpperCase()] = item.title;
                            const url = item.link || item.file || item.url;
                            if (url) {
                                const parts = url.split('/');
                                const rawName = parts[parts.length - 1].replace('.json', '').replace('sd10_', '').toUpperCase();
                                quizTitleDictionary[rawName] = item.title;
                            }
                        }
                        if (item.files) extractTitles(item.files);
                    });
                }
                if (data.quiz) extractTitles(data.quiz);
            } catch (e) { console.log("Failed to load title dictionary", e); }
        }

        function formatPrettyTitle(rawId) {
            if (!rawId) return "Unknown Exam";
            return rawId.replace(/_/g, ' ').toLowerCase().replace(/\b\w/g, char => char.toUpperCase());
        }

        function loadLeaderboardData() {
            db.collection("leaderboard").get()
              .then((querySnapshot) => {
                  allRecords = []; let uniqueQuizzes = new Set();
                  querySnapshot.forEach((doc) => {
                      const data = doc.data(); allRecords.push(data);
                      if (data.quizName) uniqueQuizzes.add(data.quizName.toUpperCase().trim());
                  });

                  const urlParams = new URLSearchParams(window.location.search);
                  let activeQuizParam = urlParams.get('quiz');
                  if (activeQuizParam) { activeQuizParam = activeQuizParam.toUpperCase().trim(); uniqueQuizzes.add(activeQuizParam); }

                  quizDropdown.innerHTML = '';
                  if (uniqueQuizzes.size === 0) {
                      quizDropdown.innerHTML = '<option value="">No Active Exams Available</option>';
                      tableBody.innerHTML = '<tr><td colspan="3" style="text-align:center; padding:30px;">No records yet.</td></tr>'; return;
                  }

                  uniqueQuizzes.forEach(quizRawId => {
                      const opt = document.createElement('option'); 
                      opt.value = quizRawId; 
                      opt.innerText = quizTitleDictionary[quizRawId] || formatPrettyTitle(quizRawId); 
                      quizDropdown.appendChild(opt);
                  });

                  if (activeQuizParam) quizDropdown.value = activeQuizParam;
                  renderLeaderboard();
              })
              .catch((error) => { console.error(error); });
        }

        function renderLeaderboard() {
            const selectedQuiz = quizDropdown.value; 
            const titleDisplay = document.getElementById('active-exam-title');
            const highlightText = document.getElementById('exam-name-highlight');
            const loggedInUser = localStorage.getItem('eduodiaUserName') ? localStorage.getItem('eduodiaUserName').toUpperCase().trim() : null;
            
            tableBody.innerHTML = '';
            
            if(!selectedQuiz) { titleDisplay.style.display = 'none'; return; }

            highlightText.innerText = quizDropdown.options[quizDropdown.selectedIndex].text;
            titleDisplay.style.display = 'block';

            let filteredDataset = allRecords.filter(record => record.quizName && record.quizName.toUpperCase().trim() === selectedQuiz);
            filteredDataset.sort((a, b) => b.score - a.score || (a.timestamp?.seconds || 0) - (b.timestamp?.seconds || 0));

            if (filteredDataset.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="3" style="text-align:center; padding: 40px; color:#777;">No scores recorded yet for this exam.</td></tr>'; return;
            }

            let rank = 1;
            filteredDataset.forEach(data => {
                const row = document.createElement('tr');
                
                const isCurrentUser = loggedInUser && data.name.toUpperCase().trim() === loggedInUser;
                if (isCurrentUser) {
                    row.style.backgroundColor = "#eaf2fb";
                    row.style.border = "1px solid var(--primary-color)";
                }

                // --- Medals Only (1, 2, 3) vs Circular Numbers (4+) ---
                let badge = "";
                if (rank === 1) badge = `<span class="medal-badge">🥇</span>`;
                else if (rank === 2) badge = `<span class="medal-badge">🥈</span>`;
                else if (rank === 3) badge = `<span class="medal-badge">🥉</span>`;
                else badge = `<span class="rank-circle">${rank}</span>`;

                const studentName = data.name ? data.name : "Anonymous Student";
                const maxQuestions = data.totalQuestions ? data.totalQuestions : 30;

                row.innerHTML = `<td>${badge}</td><td><span class="student-name">${studentName}</span></td><td><span class="score-value">${data.score}</span><span style="color:#777; font-size:0.85em;"> / ${maxQuestions}</span></td>`;
                tableBody.appendChild(row);
                rank++;
            });
        }
    </script>
</body>
</html>
